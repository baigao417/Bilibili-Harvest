name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn requests pydub moviepy yt-dlp you-get PyQt5 qdarkstyle
          python -m pip install "setuptools<81"
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --no-build-isolation openai-whisper==20240930
      - name: Run unit tests
        run: python -m unittest discover -s tests

  safety-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for private leftovers
        run: |
          python - <<'PY'
          import pathlib
          import sys

          root = pathlib.Path(".")
          blocked = [
              "https://github.com/baigao417/bili2text-",
              "private fork",
              "E:\\shape of me",
          ]
          ignored_parts = {".git", ".github", "outputs", ".venv", "__pycache__"}
          hits = []
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              if any(part in ignored_parts for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              for marker in blocked:
                  if marker in text:
                      hits.append((str(path), marker))
          if hits:
              for path, marker in hits:
                  print(f"blocked marker found: {marker} -> {path}")
              sys.exit(1)
          print("safety scan passed")
          PY
