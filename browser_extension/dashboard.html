<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>BilibiliHarvest Dashboard</title>
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <div class="page-wrapper">
      <div class="topbar">
        <div class="topbar-left">
          <img src="icons/icon128.png" class="topbar-icon" alt="" />
          <span class="topbar-title">BilibiliHarvest</span>
        </div>
        <div class="topbar-right">
          <div class="conn-group">
            <span class="status-label" id="statusLabel">未连接</span>
            <div class="status-dot" id="statusDot" title="未连接"></div>
          </div>
          <button class="btn-icon" id="settingsToggle" type="button" title="高级设置">设置</button>
        </div>
      </div>

      <div id="wizardPanel" class="card" style="display:none; margin-bottom:12px;">
        <div style="font-size:18px; font-weight:700; margin-bottom:8px;">首次连接向导</div>
        <div id="wizardStepText" class="text-muted" style="margin-bottom:12px;">正在初始化…</div>
        <div id="wizardStatus" class="status-bar" style="display:block;"></div>
        <div id="wizardArchiveRow" style="display:none; margin-top:12px;">
          <label for="wizardArchiveRoot" style="display:block; font-size:12px; margin-bottom:6px;">本地资料库目录</label>
          <input id="wizardArchiveRoot" type="text" />
        </div>
        <div style="display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;">
          <button id="wizardPrimaryBtn" class="btn btn-primary" type="button">继续</button>
          <button id="wizardSecondaryBtn" class="btn btn-outline" type="button" style="display:none;">辅助操作</button>
          <button id="wizardSkipBtn" class="btn btn-outline" type="button" style="display:none;">跳过</button>
        </div>
      </div>

      <div id="offlinePanel" class="card" style="display:none; margin-bottom:12px;">
        <div style="font-size:16px; font-weight:700; margin-bottom:6px;">后台服务未运行</div>
        <div class="text-muted" style="margin-bottom:12px;">请先运行 `scripts/setup_windows.ps1` 或桌面快捷方式，然后重新扫描。</div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button id="offlineRetryBtn" class="btn btn-primary" type="button">重新扫描</button>
          <button id="offlineGuideBtn" class="btn btn-outline" type="button">查看启动方法</button>
        </div>
      </div>

      <div class="card" id="workflowCard">
        <div class="workflow-row">
          <select id="sourceType" style="width:140px;" title="来源类型">
            <option value="auto" selected>自动识别</option>
            <option value="single">单视频</option>
            <option value="multi_p">分P视频</option>
            <option value="favorite">收藏夹</option>
            <option value="collection">合集</option>
            <option value="series">列表</option>
            <option value="space_uploads">主页投稿</option>
          </select>
          <button id="sendCurrentBtn" class="btn btn-outline" type="button" style="flex:1">
            <span class="btn-text">获取当前网页</span>
          </button>
          <button id="manualAddBtn" class="btn btn-outline" type="button" title="手动输入 URL">
            <span class="btn-text">+ 添加视频</span>
          </button>
          <button id="clearMainBtn" class="btn btn-outline" type="button" title="清空列表">
            <span class="btn-text">清空列表</span>
          </button>
        </div>

        <div class="workflow-row">
          <input id="notebookFilter" class="notebook-filter" type="text" placeholder="过滤 Notebook…" />
          <select id="nlmNotebook" style="flex:1">
            <option value="">选择 Notebook</option>
          </select>
          <button id="nlmRefreshBtn" class="btn btn-outline btn-sm" type="button" title="刷新列表">
            <span class="btn-text">刷新</span>
          </button>
        </div>

        <div class="workflow-row">
          <button id="mainNlmBtn" class="btn btn-primary workflow-btn" type="button">
            <span class="btn-text">一键推送到 NotebookLM</span>
          </button>
        </div>

        <div class="workflow-row">
          <input id="newNotebookName" type="text" placeholder="输入新 Notebook 名称…" style="flex:1" />
          <button id="nlmCreateBtn" class="btn btn-outline btn-sm" type="button">
            <span class="btn-text">+ 新建 Notebook</span>
          </button>
        </div>

        <div id="notebookCreateSuccess" class="nlm-success-panel" style="display:none; margin-bottom:10px;">
          <div class="nlm-success-head">
            <span class="nlm-success-icon">✓</span>
            <span class="nlm-success-text">创建成功：<span id="notebookCreateName"></span></span>
          </div>
          <a id="notebookOpenBtn" class="nlm-open-btn" href="#" target="_blank">打开 Notebook</a>
        </div>

        <div class="workflow-row" style="border-top:1px solid #e0e0e0; padding-top:12px; margin-top:4px;">
          <button id="mainShapeBtn" class="btn btn-success workflow-btn" type="button">
            <span class="btn-text">保存到本地资料库</span>
          </button>
        </div>

        <div id="statusCard" class="status-card" style="display:none; margin-top:12px;">
          <div class="progress-wrap">
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <span class="progress-text" id="progressText">就绪</span>
          </div>
          <div id="nlmSuccessPanel" class="nlm-success-panel" style="display:none">
            <div class="nlm-success-head">
              <span class="nlm-success-icon">✓</span>
              <span class="nlm-success-text">推送成功</span>
            </div>
            <a id="nlmOpenBtn" class="nlm-open-btn" href="#" target="_blank">打开 Notebook</a>
          </div>
          <div id="shapeSuccessPanel" class="nlm-success-panel" style="display:none">
            <div class="nlm-success-head">
              <span class="nlm-success-icon" style="background:var(--success)">✓</span>
              <span class="nlm-success-text">已保存到本地资料库</span>
            </div>
            <div class="text-muted" id="shapeSuccessPath" style="font-size:11px; margin-top:4px">已写入本地资料库</div>
          </div>
        </div>
      </div>

      <div id="drawerOverlay" class="drawer-overlay"></div>
      <div id="advancedDrawer" class="advanced-drawer">
        <div class="drawer-header">
          <h3>高级设置</h3>
          <button id="closeDrawer" class="btn-icon" type="button">×</button>
        </div>
        <div class="drawer-content">
          <div class="input-field">
            <label for="importMode">导入模式</label>
            <select id="importMode">
              <option value="single">单视频</option>
              <option value="all_pages">全部分P</option>
            </select>
          </div>

          <div class="input-field">
            <label for="limit">抓取上限</label>
            <input id="limit" type="number" min="1" max="2000" value="200" />
          </div>

          <div class="input-field">
            <label for="order">排序方式</label>
            <select id="order">
              <option value="pubdate_desc">最新优先</option>
              <option value="pubdate_asc">最早优先</option>
            </select>
          </div>

          <div class="input-field" style="margin-top:12px">
            <label for="urlInput">批量添加链接（可逐条勾选保存）</label>
            <textarea id="urlInput" rows="3" placeholder="https://www.bilibili.com/video/BV..."></textarea>
          </div>
          <div id="urlPreview" class="url-preview" style="display:none">
            <div class="url-preview-header">
              <label class="check url-preview-select-all">
                <input type="checkbox" id="selectAllShape" />
                <span>全部保存到资料库</span>
              </label>
              <span class="url-preview-count" id="urlPreviewCount"></span>
            </div>
            <div id="urlPreviewList" class="url-preview-list"></div>
          </div>

          <div style="margin-top:10px; display:flex; gap:8px">
            <button id="addBtn" class="btn btn-primary" type="button" style="flex:1">添加到列表</button>
          </div>

          <div class="divider"></div>

          <div style="display:flex; gap:8px">
            <button id="startBtn" class="btn btn-outline btn-sm" type="button">开始处理</button>
            <button id="stopBtn" class="btn btn-danger btn-sm" type="button" disabled>停止</button>
            <button id="clearBtn" class="btn btn-outline btn-sm" type="button">清空列表</button>
          </div>

          <div class="divider"></div>

          <div class="settings-row">
            <div class="settings-field">
              <label>端口</label>
              <input id="cfgPort" type="number" />
            </div>
            <div class="settings-field" style="flex:1">
              <label>Token</label>
              <input id="cfgToken" type="password" />
            </div>
          </div>
          <div style="display:flex; gap:8px; margin-top:8px">
            <button id="cfgSaveBtn" class="btn btn-outline btn-sm" type="button" style="flex:1">保存配置</button>
            <button id="cfgTestBtn" class="btn btn-outline btn-sm" type="button" style="flex:1">测试连接</button>
          </div>
        </div>
      </div>

      <div class="card" style="padding:0;overflow:hidden;">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="col-seq">#</th>
                <th class="col-bv">BV号</th>
                <th class="col-title">标题</th>
                <th class="col-owner">作者</th>
                <th class="col-source">来源</th>
                <th class="col-status">状态</th>
                <th class="col-result">结果来源</th>
                <th class="col-lang">语言</th>
                <th class="col-actions">操作</th>
              </tr>
            </thead>
            <tbody id="taskTableBody"></tbody>
          </table>
        </div>
        <div class="empty-state" id="emptyState" style="display:none">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <path d="M9 9h6M9 13h4"></path>
          </svg>
          <p>暂无任务</p>
          <p class="sub">在上方添加视频链接即可开始使用</p>
        </div>
      </div>

      <div class="status-bar" id="statusBar"></div>
    </div>
    <script src="dashboard.js"></script>
  </body>
</html>
